name: irina application

on:
  push:
    branches:
      - irina

permissions:
  contents: read
  packages: write
  packages: delete   # ⬅ necesario para modificar visibilidad

env:
  IMAGE_NAME: ghcr.io/lizira/irina-app
  IMAGE_TAG: 1.0.5

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Código del repo
      - uses: actions/checkout@v4

      # 2. Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      # 3. Dependencias
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Login a GHCR con el token
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR }}

      # 5. Build y Push Imagen
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lizira/irina-app:1.0.5

      # 6. Hacer PUBLICO el package
      - name: Make GHCR package public
        run: |
          PACKAGE="irina-app"
          OWNER="${{ github.repository_owner }}"
          echo "Haciendo el package PUBLICO en GHCR..."
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GHCR }}" \
            -H "Accept: application/vnd.github+json" \
            -X PATCH \
            https://api.github.com/users/$OWNER/packages/container/$PACKAGE/visibility \
            -d '{"visibility":"public"}'

      # 7. Debug de secrets
      - name: Debug secrets
        run: |
          echo "HOST='${{ secrets.VPS_HOST }}'"
          echo "USER='${{ secrets.VPS_USER }}'"
          echo "PORT='${{ secrets.VPS_SSH_PORT }}'"

      # 8. Probar puerto SSH
      - name: Test SSH port
        run: |
          echo "Testing SSH port..."
          nc -zv ${{ secrets.VPS_HOST }} ${{ secrets.VPS_SSH_PORT }} || echo "SSH PORT NOT OPEN"

      # 9. Probar login SSH
      - name: SSH Connected OK?
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "SSH OK"
            hostname
            whoami
            uptime

      # 10. Copiar stack.yml
      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/irina"

      # 11. Desplegar stack
      - name: Deploy stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "Desplegando stack..."
            cd ~/irina
            
            echo "PULL DE LA IMAGEN"
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR }}
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "BAJANDO SERVICIO ANTERIOR"
            docker stack rm irina || true

            echo "ESPERANDO 20s..."
            sleep 20

            echo "DESPLEGANDO NUEVO STACK"
            docker stack deploy --with-registry-auth -c stack.yml irina

            echo "SERVICIOS ACTIVOS:"
            docker service ls
